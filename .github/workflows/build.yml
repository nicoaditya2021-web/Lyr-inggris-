name: Build LYR
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Extract project and build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ZIP=""
          for z in LYR.zip LyricsPlusBridge.zip; do
            if [ -f "$z" ]; then ZIP="$z"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "File LYR.zip tidak ditemukan di root repo" | tee "$GITHUB_WORKSPACE/build.log"
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p proj
          unzip -q "$ZIP" -d proj
          DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "$DIR" > projdir.txt
          # the add-on is bundled inside the APK (the app can install it into Minecraft)
          mkdir -p "$DIR/app/src/main/assets"
          rm -f "$DIR/app/src/main/assets/LYR.mcaddon"
          (cd "$DIR/addon" && zip -qr "$GITHUB_WORKSPACE/$DIR/app/src/main/assets/LYR.mcaddon" LYR_BP LYR_RP)
          cd "$DIR"
          gradle :app:assembleRelease --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Collect APK and add-on
        run: |
          DIR=$(cat projdir.txt)
          mkdir -p dist
          cp "$DIR"/app/build/outputs/apk/release/*.apk dist/LYR.apk
          (cd "$DIR/addon" && zip -qr "$GITHUB_WORKSPACE/dist/LYR.mcaddon" LYR_BP LYR_RP)
      - name: Show errors on the summary page
        if: failure()
        run: |
          echo "## Build gagal - error:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Execution failed|tidak ditemukan" -A3 build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "build.log belum dibuat (gagal sebelum Gradle jalan)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: LYR
          path: |
            dist/LYR.apk
            dist/LYR.mcaddon
      - name: Publish GitHub Release (push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LYR.apk
            dist/LYR.mcaddon
            
